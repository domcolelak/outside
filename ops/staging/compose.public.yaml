configs:
  blackbox-public:
    content: |
      modules:
        outside_https:
          prober: http
          timeout: 5s
          http:
            method: GET
            valid_status_codes: [200]
            preferred_ip_protocol: ip4
            headers:
              Host: ${STAGING_DOMAIN:?Set STAGING_DOMAIN to the public hostname}
            tls_config:
              server_name: ${STAGING_DOMAIN:?Set STAGING_DOMAIN to the public hostname}
              insecure_skip_verify: false

services:
  caddy:
    ports: !override
      - 80:80
      - ${HTTPS_PORT:-443}:443
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3001
    volumes:
      - ./proxy/Caddyfile.public:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  blackbox-exporter:
    volumes: !reset []
    configs:
      - source: blackbox-public
        target: /etc/blackbox_exporter/config.yaml
